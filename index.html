<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban Board · Tareas pendientes</title>
  <meta name="description" content="Tablero Kanban para gestionar tareas pendientes.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="8" rx="1.5"/></svg>
      </div>
      <div>
        <h1>Kanban Board</h1>
        <p class="subtitle">Organiza tu trabajo, cumple tus metas</p>
      </div>
    </div>

    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Buscar tareas…" aria-label="Buscar tareas">
      </label>
      <select id="filterPriority" aria-label="Filtrar por prioridad">
        <option value="all">Todas las prioridades</option>
        <option value="high">Alta</option>
        <option value="medium">Media</option>
        <option value="low">Baja</option>
      </select>
      <button id="themeBtn" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="newBtn" class="btn primary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nueva tarea
      </button>
    </div>
  </header>

  <section class="stats" aria-label="Resumen">
    <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">Tareas</span></div>
    <div class="stat"><span class="stat-num" id="statDoing">0</span><span class="stat-label">En progreso</span></div>
    <div class="stat"><span class="stat-num" id="statLate">0</span><span class="stat-label">Vencidas</span></div>
    <div class="stat wide">
      <div class="progress-head"><span class="stat-label">Progreso</span><span id="statPct">0%</span></div>
      <div class="bar"><div id="barFill"></div></div>
    </div>
  </section>

  <main class="board" id="board" aria-label="Tablero"></main>

  <dialog id="modal">
    <form id="form" method="dialog">
      <div class="modal-head">
        <h2 id="modalTitle">Nueva tarea</h2>
        <button type="button" class="icon-btn" id="closeBtn" aria-label="Cerrar">✕</button>
      </div>

      <label>Título
        <input id="fTitle" required maxlength="80" placeholder="¿Qué hay que hacer?">
      </label>
      <label>Descripción
        <textarea id="fDesc" rows="3" maxlength="300" placeholder="Detalles opcionales"></textarea>
      </label>

      <div class="row">
        <label>Columna
          <select id="fStatus"></select>
        </label>
        <label>Prioridad
          <select id="fPriority">
            <option value="low">Baja</option>
            <option value="medium" selected>Media</option>
            <option value="high">Alta</option>
          </select>
        </label>
      </div>

      <div class="row">
        <label>Fecha límite
          <input id="fDue" type="date">
        </label>
        <label>Etiqueta
          <input id="fTag" maxlength="20" placeholder="Ej: Diseño">
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn danger" id="deleteBtn">Eliminar</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
